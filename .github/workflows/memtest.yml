name: Memory test (temporary)

# One-off measurement (removed again): Minecraft with a 500 MB heap in a singleplayer world, see .github/memtest/.
on:
  push:
    paths: [ '.github/workflows/memtest.yml', '.github/memtest/**' ]

permissions:
  contents: read

jobs:
  memtest:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [ "1.12.2", "1.14.4", "1.16.5", "1.17.1", "1.18.2", "1.19.4", "1.20.1", "1.20.6", "1.21.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17, 21, 25 (the last one is the default)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Server ${{ matrix.version }} creating a new world with small heaps
        run: python3 .github/memtest/servertest.py "${{ matrix.version }}" 250 300 350 400

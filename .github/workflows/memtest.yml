name: Memory test (temporary)

# One-off measurement (removed again): Minecraft with a 500 MB heap in a singleplayer world, see .github/memtest/.
on:
  push:
    paths: [ '.github/workflows/memtest.yml', '.github/memtest/**' ]

permissions:
  contents: read

jobs:
  memtest:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: server, version: "1.14.4" }
          - { kind: server, version: "1.16.5" }
          - { kind: server, version: "1.17.1" }
          - { kind: server, version: "1.18.2" }
          - { kind: server, version: "1.19.4" }
          - { kind: server, version: "1.20.1" }
          - { kind: server, version: "1.20.4" }
          - { kind: server, version: "1.20.6" }
          - { kind: server, version: "1.21.11" }
          - { kind: client, version: "1.20.1" }
          - { kind: client, version: "1.20.4" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17, 21, 25 (the last one is the default)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Build the low-memory agent
        run: |
          chmod +x gradlew
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew jre_lowmem_agent:jar --no-daemon -q
          echo "AGENT=$PWD/ZalithLauncher/src/main/assets/components/components/lowmem-agent.jar" >> "$GITHUB_ENV"

      - name: Server ${{ matrix.version }} creating a new world, with the agent
        if: matrix.kind == 'server'
        run: python3 .github/memtest/servertest.py "${{ matrix.version }}" 250 300 350

      - name: Virtual display with software OpenGL
        if: matrix.kind == 'client'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libxkbcommon0 > /dev/null
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Minecraft ${{ matrix.version }} singleplayer at 500 MB, with and without the agent
        if: matrix.kind == 'client'
        run: python3 .github/memtest/memtest.py "${{ matrix.version }}" 120 agent= base= 2>&1 | tail -60

name: Probe (temporary)

# One-off check of what Minecraft 26.x needs from LWJGL. Removed again after reading the results.
on:
  push:
    paths: [ '.github/workflows/probe.yml' ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: LWJGL linkage of Minecraft 26.x against the bundled LWJGL
        run: |
          python3 - <<'PY'
          import io, json, re, struct, urllib.request, zipfile, glob, collections
          def get(url):
              return urllib.request.urlopen(url, timeout=180).read()

          def parse(data):
              """Minimal class file parser: name, super, interfaces, members, member references."""
              p = 8; n = struct.unpack_from(">H", data, p)[0]; p += 2
              cp = [None] * n; i = 1
              while i < n:
                  t = data[p]
                  if t == 1:
                      l = struct.unpack_from(">H", data, p + 1)[0]; cp[i] = (1, data[p + 3:p + 3 + l].decode("utf-8", "replace")); p += 3 + l
                  elif t in (3, 4): cp[i] = (t,); p += 5
                  elif t in (5, 6): cp[i] = (t,); p += 9; i += 1
                  elif t in (7, 8, 16, 19, 20): cp[i] = (t, struct.unpack_from(">H", data, p + 1)[0]); p += 3
                  elif t in (9, 10, 11, 12, 17, 18): cp[i] = (t,) + struct.unpack_from(">HH", data, p + 1); p += 5
                  elif t == 15: cp[i] = (t,); p += 4
                  else: raise ValueError(t)
                  i += 1
              utf = lambda k: cp[k][1]
              cls = lambda k: utf(cp[k][1])
              access, this, sup = struct.unpack_from(">HHH", data, p); p += 6
              ic = struct.unpack_from(">H", data, p)[0]; p += 2
              ifaces = [cls(struct.unpack_from(">H", data, p + 2 * j)[0]) for j in range(ic)]; p += 2 * ic
              members = set()
              for _ in range(2):
                  c = struct.unpack_from(">H", data, p)[0]; p += 2
                  for _ in range(c):
                      _, ni, di, ac = struct.unpack_from(">HHHH", data, p); p += 8
                      members.add((utf(ni), utf(di)))
                      for _ in range(ac):
                          l = struct.unpack_from(">I", data, p + 2)[0]; p += 6 + l
              refs, classrefs = set(), set()
              for e in cp:
                  if e and e[0] in (9, 10, 11):
                      owner = cls(e[1]); nt = cp[e[2]]
                      refs.add((owner, utf(nt[1]), utf(nt[2])))
                  elif e and e[0] == 7:
                      classrefs.add(utf(e[1]))
              return cls(this), (cls(sup) if sup else None), ifaces, members, refs, classrefs

          def load_bundle(paths):
              classes = {}
              for path in paths:
                  z = zipfile.ZipFile(path)
                  for name in z.namelist():
                      if name.endswith(".class") and not name.startswith("META-INF"):
                          c = parse(z.read(name))
                          classes.setdefault(c[0], c)   # first jar wins, like the classpath
              return classes

          # Methods that LWJGL classes really inherit from JDK supertypes (Object, AutoCloseable, Iterable)
          JDK_INHERITED = {"equals", "hashCode", "toString", "getClass", "clone", "finalize", "notify", "notifyAll",
                           "wait", "close", "iterator", "forEach", "spliterator", "ordinal", "name", "compareTo",
                           "getDeclaringClass", "getMessage", "getLocalizedMessage", "getCause", "printStackTrace",
                           "getStackTrace", "apply", "accept", "test", "get", "run", "call", "values", "valueOf"}
          def has_member(bundle, owner, name, desc, seen=None):
              seen = seen if seen is not None else set()
              if owner in seen: return False
              seen.add(owner)
              c = bundle.get(owner)
              if c is None:
                  # A JDK supertype: constructors and fields are never inherited from there
                  return not owner.startswith("org/lwjgl/") and "(" in desc and name in JDK_INHERITED
              if (name, desc) in c[3]: return True
              if name == "<init>" or name == "<clinit>": return False
              return any(has_member(bundle, s, name, desc, seen) for s in ([c[1]] if c[1] else []) + c[2])

          A = "ZalithLauncher/src/main/assets/components"
          # The launcher's own GLFW stub classes (module jre_lwjgl3glfw), without the merged LWJGL 3.3.6 jars
          import os
          own = {os.path.relpath(os.path.join(r, f[:-5]), "jre_lwjgl3glfw/src/main/java")
                 for r, _, fs in os.walk("jre_lwjgl3glfw/src/main/java") for f in fs if f.endswith(".java")}
          own = {o for o in own if not o.startswith("net/java/") and o != "org/lwjgl/input/InfdevMouse"}
          src = zipfile.ZipFile(f"{A}/lwjgl3/lwjgl-glfw-classes.jar")
          with zipfile.ZipFile("/tmp/stub.jar", "w") as z:
              for n in src.namelist():
                  if n.endswith(".class") and n.split("$")[0].removesuffix(".class") in own:
                      z.writestr(n, src.read(n))
          official341 = sorted(j for j in glob.glob(f"{A}/lwjgl3-sdl/*.jar") if not j.endswith("/lwjgl-sdl.jar"))
          bundles = {
              "glfw-3.3.6 (lwjgl3)": load_bundle([f"{A}/lwjgl3/lwjgl-glfw-classes.jar"]),
              "glfw-3.4.1 (stub + lwjgl3-sdl jars)": load_bundle(["/tmp/stub.jar"] + official341),
              "sdl-3.4.1 (lwjgl3-sdl)": load_bundle(sorted(glob.glob(f"{A}/lwjgl3-sdl/*.jar"))),
          }
          def check(vid, sdl, bname, bundle, jar):
              missing_cls, missing_mem, users = collections.Counter(), collections.Counter(), collections.defaultdict(set)
              for name in jar.namelist():
                  if not name.endswith(".class"): continue
                  _, _, _, _, refs, classrefs = parse(jar.read(name))
                  for c in classrefs:
                      c = c.lstrip("[").removeprefix("L").removesuffix(";")
                      if c.startswith("org/lwjgl/") and c not in bundle:
                          missing_cls[c] += 1; users[c].add(name)
                  for owner, mname, desc in refs:
                      if owner.startswith("org/lwjgl/") and owner in bundle and not has_member(bundle, owner, mname, desc):
                          key = f"{owner}.{mname}{desc}"; missing_mem[key] += 1; users[key].add(name)
              pk = collections.Counter("/".join(c.split("/")[:3 if not c.startswith("org/lwjgl/util/") else 4]) for c in missing_cls)
              lines = [f"{vid} ({'SDL' if sdl else 'GLFW'}) against {bname}: {len(missing_cls)} missing classes, {len(missing_mem)} missing methods/fields",
                       "missing classes by package: " + ", ".join(f"{k}={v}" for k, v in pk.most_common())]
              lines += ["  " + k + "   <- " + ", ".join(sorted(users[k])[:2]) for k, _ in missing_mem.most_common(25)]
              msg = "\n".join(lines)
              print(msg)
              print(f"::notice title=Linkage {vid} / {bname.split(' ')[0]}::" + msg.replace("%", "%25").replace("\n", "%0A"))

          def users_of(jar, prefixes):
              found = collections.defaultdict(set)
              for name in jar.namelist():
                  if name.endswith(".class"):
                      for c in parse(jar.read(name))[5]:
                          for pre in prefixes:
                              if c.startswith(pre): found[pre].add(name.removesuffix(".class"))
              return found

          manifest = json.loads(get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          by_id = {v["id"]: v for v in manifest["versions"]}
          latest = manifest["latest"]
          print("latest:", latest)
          for vid in ["1.21.11", "26.1.2", "26.2", "26.3", latest["snapshot"]]:
              meta = json.loads(get(by_id[vid]["url"]))
              sdl = any(l["name"].startswith("org.lwjgl:lwjgl-sdl:") for l in meta["libraries"])
              jar = zipfile.ZipFile(io.BytesIO(get(meta["downloads"]["client"]["url"])))
              for bname in (["sdl-3.4.1 (lwjgl3-sdl)"] if sdl else ["glfw-3.3.6 (lwjgl3)", "glfw-3.4.1 (stub + lwjgl3-sdl jars)"]):
                  check(vid, sdl, bname, bundles[bname], jar)
              if vid == "26.2":
                  u = users_of(jar, ("org/lwjgl/util/shaderc", "org/lwjgl/util/spvc", "org/lwjgl/util/vma"))
                  msg = "\n".join(f"{k}: " + ", ".join(sorted(v)) for k, v in u.items())
                  print(msg)
                  print("::notice title=26.2 users of shaderc/spvc/vma::" + msg.replace("%", "%25").replace("\n", "%0A"))
          PY

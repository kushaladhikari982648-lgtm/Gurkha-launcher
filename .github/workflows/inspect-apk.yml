name: Inspect debug APK (temporary)

# One-off: lists the SDL/LTW related contents of the debug APKs built by an Android CI run.
# Removed again right after it ran.

on:
  push:
    branches: [ 'arena/1d667cb8-gurkha-launcher' ]
    paths: [ '.github/workflows/inspect-apk.yml' ]

permissions:
  contents: read
  actions: read

jobs:
  Inspect:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [ "arm64", "arm" ]
    steps:
      - name: Download the debug APK
        uses: actions/download-artifact@v8
        with:
          name: GurkhaLauncher(Debug) ${{ matrix.arch }}
          run-id: 39007379267
          github-token: ${{ github.token }}
          path: apk

      - name: List contents
        run: |
          APK=$(ls apk/*.apk | head -1)
          {
            echo "APK: $(basename "$APK") $(stat -c %s "$APK") bytes"
            unzip -l "$APK" | awk '{print $1, $4}' | grep -E "lib/.*/(libSDL3|libSDL2|libltw|libltw_sdl_egl|libspirv-cross-c-shared|libpojavexec|liblwjgl)\.so$|assets/components/lwjgl3-sdl/|assets/components/lwjgl-3.4.1-natives/" | sort -k2
            echo "lwjgl3-sdl version: $(unzip -p "$APK" assets/components/lwjgl3-sdl/version)"
            unzip -o -q "$APK" 'lib/*/libltw_sdl_egl.so' 'lib/*/libpojavexec.so' -d x
            NM=$(ls -d "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm 2>/dev/null || which llvm-nm)
            for f in x/lib/*/libltw_sdl_egl.so; do echo "$f exports $("$NM" -D --defined-only "$f" | grep -c ' egl') EGL functions"; done
            for f in x/lib/*/libpojavexec.so; do echo "$f: $("$NM" -D --defined-only "$f" | grep -o 'Java_org_lwjgl_glfw_CallbackBridge_nativeNotifyLauncher')"; done
          } > "$RUNNER_TEMP/report.txt" 2>&1
          cat "$RUNNER_TEMP/report.txt"
          MSG=$(python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A"))' < "$RUNNER_TEMP/report.txt")
          echo "::notice title=APK ${{ matrix.arch }}::$MSG"

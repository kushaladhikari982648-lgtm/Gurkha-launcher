name: Build Krypton Wrapper (temporary)

# One-off build of Krypton Wrapper (NG-GL4ES) for the launcher: the official releases only ship an arm64 build inside
# their plugin app. Builds the R0.4.5 source for all four ABIs with the plugin's settings (NDK 27.3.13750724,
# c++_static, API 21), compares the arm64 build with the official one and commits ZalithLauncher/libs/ng_gl4es-release.aar.
# Removed again afterwards.
on:
  push:
    paths: [ '.github/workflows/build-krypton.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout NG-GL4ES R0.4.5
        uses: actions/checkout@v7
        with:
          repository: BZLZHH/NG-GL4ES
          ref: R0.4.5
          submodules: recursive
          path: ng-gl4es

      - name: Install NDK 27.3.13750724
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          command -v ninja > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build > /dev/null; }

      - name: Build libng_gl4es.so
        run: |
          set -o pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if cmake -S ng-gl4es -B "build/$abi" -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
                  -DCMAKE_BUILD_TYPE=Release > "build-$abi.log" 2>&1 &&
               cmake --build "build/$abi" --target ng_gl4es -j4 >> "build-$abi.log" 2>&1; then
              mkdir -p "out/jni/$abi"
              cp "build/$abi/libng_gl4es.so" "out/jni/$abi/"
              echo "$abi: built"
            else
              echo "::warning title=Krypton Wrapper $abi::build failed: $(grep -m3 -E 'error|Error' "build-$abi.log" | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          ls -la out/jni/*/

      - name: Compare with the official arm64 build and package
        run: |
          curl -sSL -o plugin.apk https://github.com/BZLZHH/NGG-FCLRendererPlugin/releases/download/R0.4.5/Krypton_Wrapper_0.4.5.apk
          unzip -o -q plugin.apk 'lib/*' -d official
          python3 - <<'PY'
          import os, subprocess, zipfile, io, glob, hashlib
          readelf = os.path.join(os.environ["NDK"], "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf")
          def exports(path):
              out = subprocess.run([readelf, "--dyn-syms", "-W", path], capture_output=True, text=True).stdout
              return sorted({l.split()[-1] for l in out.splitlines() if " FUNC " in l and " GLOBAL " in l and " UND " not in l})
          def needed(path):
              out = subprocess.run([readelf, "-d", "-W", path], capture_output=True, text=True).stdout
              return [l.split("[")[1].rstrip("]") for l in out.splitlines() if "(NEEDED)" in l]
          official = glob.glob("official/lib/arm64-v8a/libng_gl4es.so")
          lines = []
          ours = "out/jni/arm64-v8a/libng_gl4es.so"
          if official and os.path.exists(ours):
              a, b = exports(official[0]), exports(ours)
              lines.append(f"official arm64: {os.path.getsize(official[0])} bytes, {len(a)} exported functions, needs {needed(official[0])}")
              lines.append(f"our arm64:      {os.path.getsize(ours)} bytes, {len(b)} exported functions, needs {needed(ours)}")
              lines.append(f"exports only in official: {sorted(set(a) - set(b))[:20]}")
              lines.append(f"exports only in ours: {sorted(set(b) - set(a))[:20]}")
          for so in sorted(glob.glob("out/jni/*/libng_gl4es.so")):
              lines.append(f"{so}: {os.path.getsize(so)} bytes, sha256 {hashlib.sha256(open(so, 'rb').read()).hexdigest()[:16]}, needs {needed(so)}")
          msg = "\n".join(lines)
          print(msg)
          print("::notice title=Krypton Wrapper build::" + msg.replace("%", "%25").replace("\n", "%0A"))
          # aar: the same layout as the other native libraries in ZalithLauncher/libs
          def jar():
              b = io.BytesIO()
              with zipfile.ZipFile(b, "w") as z:
                  z.writestr("META-INF/MANIFEST.MF", "Manifest-Version: 1.0\r\n\r\n")
              return b.getvalue()
          with zipfile.ZipFile("ZalithLauncher/libs/ng_gl4es-release.aar", "w", zipfile.ZIP_DEFLATED) as aar:
              aar.writestr("AndroidManifest.xml", '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.bzlzhh.ng_gl4es" />\n')
              aar.writestr("classes.jar", jar())
              aar.writestr("R.txt", "")
              aar.writestr("META-INF/com/android/build/gradle/aar-metadata.properties",
                           "aarFormatVersion=1.0\naarMetadataVersion=1.0\nminCompileSdk=1\nminCompileSdkExtension=0\nminAndroidGradlePluginVersion=1.0.0\n")
              for so in sorted(glob.glob("out/jni/*/libng_gl4es.so")):
                  aar.write(so, so[len("out/"):])
          PY
          abis=$(cd out/jni && ls | tr '\n' ' ')
          cat > ZalithLauncher/libs/ng_gl4es-release.txt <<EOF
          ng_gl4es-release.aar: Krypton Wrapper (NG-GL4ES), OpenGL 3.1 on top of OpenGL ES 3
          Source:  https://github.com/BZLZHH/NG-GL4ES (MIT), tag R0.4.5 ($(git -C ng-gl4es rev-parse HEAD))
                   with glslang $(git -C ng-gl4es/3rdparty/glslang rev-parse --short HEAD) and SPIRV-Cross $(git -C ng-gl4es/3rdparty/SPIRV-Cross rev-parse --short HEAD)
          Build:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
                   NDK 27.3.13750724, android-21, c++_static, Release (the settings of the official plugin app,
                   https://github.com/BZLZHH/NGG-FCLRendererPlugin, which ships an arm64 build only)
          ABIs:    ${abis}
          EOF
          cat ZalithLauncher/libs/ng_gl4es-release.txt

      - name: Commit the library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZalithLauncher/libs/ng_gl4es-release.aar ZalithLauncher/libs/ng_gl4es-release.txt
          git commit -m "chore: add the Krypton Wrapper library (BZLZHH/NG-GL4ES R0.4.5, built for all ABIs)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

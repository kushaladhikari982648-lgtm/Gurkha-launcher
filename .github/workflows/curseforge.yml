name: Check CurseForge API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Authenticate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check credential and Minecraft mod search
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 tools/check_curseforge.py --require-key

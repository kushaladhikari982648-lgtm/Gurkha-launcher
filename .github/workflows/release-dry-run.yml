name: Release dry run (temporary)

# One-off check of the release build path with a throwaway key (nothing is published).
# This file is removed again right after the check.

on:
  push:
    branches: [ 'arena/1d667cb8-gurkha-launcher' ]
    paths: [ '.github/workflows/release-dry-run.yml' ]

permissions:
  contents: read

jobs:
  DryRun:
    runs-on: ubuntu-22.04
    env:
      ZL_BUILD_TYPE: PRE_RELEASE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Throwaway keystore (same keytool command as RELEASING.md)
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/throwaway.jks" -alias gurkha -keyalg RSA -keysize 4096 -validity 10000 -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -dname "CN=Release dry run"
          base64 -w 0 "$RUNNER_TEMP/throwaway.jks" > "$RUNNER_TEMP/throwaway.b64"
          rm "$RUNNER_TEMP/throwaway.jks"
          echo "TEST_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Keystore check and decode (same commands as android.yml)
        run: |
          KEYSTORE_BASE64=$(cat "$RUNNER_TEMP/throwaway.b64")
          export GURKHA_KEYSTORE_PASSWORD="$TEST_KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/gurkha-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass:env GURKHA_KEYSTORE_PASSWORD -alias gurkha
          echo "GURKHA_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build release (arm)
        env:
          # Unset optional secrets arrive as empty strings in the real workflow too.
          GURKHA_KEY_ALIAS: ''
          GURKHA_KEY_PASSWORD: ''
        run: |
          export GURKHA_KEYSTORE_PASSWORD="$TEST_KEYSTORE_PASSWORD"
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm

      - name: Inspect APK
        run: |
          ls -l ZalithLauncher/build/outputs/apk/release/
          APK=ZalithLauncher/build/outputs/apk/release/GurkhaLauncher-1.0.0-beta.1-armeabi-v7a.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT"/apksigner verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate DN|scheme"
          "$BT"/aapt2 dump badging "$APK" | grep -E "^package:|^application-label:|^native-code:|^sdkVersion:|^targetSdkVersion:"
          unzip -l "$APK" | grep -E "assets/components/jre-[0-9]+/" | awk '{print $4}'

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/gurkha-release.jks" "$RUNNER_TEMP/throwaway.b64"

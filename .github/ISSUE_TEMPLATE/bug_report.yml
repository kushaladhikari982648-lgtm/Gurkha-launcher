name: Bug report
description: Something is not working in Gurkha Launcher.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Gurkha! Please check existing issues first.
        **Never post API keys, access tokens, account details, or unredacted personal information.**
        If CurseForge says this build has no API key, see [the setup guide](https://github.com/kushaladhikari982648-lgtm/Gurkha-launcher/blob/main/RELEASING.md#curseforge-api-key). The APK needs to be rebuilt with an approved key.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Launcher interface or settings
        - Game launch or rendering
        - Downloads / CurseForge / Modrinth
        - Controls or input
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. The error appears ...
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version and build source
      description: Include the release tag or Actions run link, and APK architecture if known.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Phone model, Android version, RAM, GPU (if known)
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Minecraft version, renderer, and mod loader
      description: For game issues, include the exact renderer and loader version. Otherwise write N/A.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach the relevant launcher/game log and error screenshot if available. Redact credentials and personal data first.

name: Feature request
description: Suggest an improvement to Gurkha Launcher.
body:
  - type: markdown
    attributes:
      value: Please search existing requests first. Small, focused suggestions are easier to discuss and test.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the current launcher falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggested improvement
      description: Explain how you would like it to work. Mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried? Are there simpler ways to solve the same problem?
  - type: textarea
    id: context
    attributes:
      label: Device details or other context
      description: For compatibility or performance requests, include Android version, GPU, game version, and renderer.
